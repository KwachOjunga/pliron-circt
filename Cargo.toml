[workspace]
resolver = "2"
members = ["v-parser"]

[package]
name = "pliron-circt"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/KwachOjunga/pliron-circt"
categories = ["compilers"]
keywords = ["pliron", "hardware", "circt", "compiler", "rtl"]
authors = ["Reginald Ojunga"]
description = "An MLIR-based compiler infrastructure spanning multiple abstraction levels of hardware representation, transformation, and RTL generation"

[features]
default = ["sv", "hw", "comb", "seq", "fsm"]
sv = []
hw = []
comb = []
seq = []
fsm = []

[dependencies]
pliron.workspace = true
thiserror.workspace = true
log.workspace = true
rustc-hash.workspace = true
awint.workspace = true


[dev-dependencies]
expect-test = "1"
env_logger = "0"

[workspace.dependencies]
pliron =   "0.18.0"
thiserror = "2"
log = { version = "0" }
rustc-hash = "2"
awint = "0"
