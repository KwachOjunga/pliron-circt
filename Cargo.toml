[package]
name = "pliron-circt"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/KwachOjunga/pliron-circt"
categories = ["compilers"]
keywords = ["pliron", "hardware", "circt", "compiler", "rtl"]
authors = ["Reginald Ojunga"]

[features]
default = ["sv", "hw", "comb", "seq"]
sv = []
hw = []
comb = []
seq = []

[dependencies]
pliron =  {git = "https://github.com/pliron-org/pliron", rev = "e66025a"}
thiserror = "2"
log = { version = "0" }
rustc-hash = "2"
awint = "0"

[dev-dependencies]
expect-test = "1"
env_logger = "0"
